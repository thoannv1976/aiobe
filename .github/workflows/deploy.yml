name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - claude/sweet-edison-2QAd4
  workflow_dispatch:

env:
  SERVICE_NAME: aiobe
  REPOSITORY: aiobe

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          [ -n "$GCP_PROJECT_ID" ] || { echo "Missing secret GCP_PROJECT_ID"; exit 1; }
          [ -n "$GCP_REGION" ]     || { echo "Missing secret GCP_REGION"; exit 1; }
          [ -n "$GCP_SA_KEY" ]     || { echo "Missing secret GCP_SA_KEY"; exit 1; }
          [ -n "$DATABASE_URL" ]   || { echo "Missing secret DATABASE_URL"; exit 1; }
          echo "✓ All required secrets present"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (for Prisma migrate)
        run: npm ci

      - name: Apply Prisma schema to database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db push --accept-data-loss

      - name: Configure Docker for Artifact Registry
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build & Push Docker image
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"
          echo "Building image: $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          # Dùng YAML env-vars-file để tránh vấn đề escape với dấu phẩy/đặc biệt
          python3 -c "
          import yaml, os
          with open('/tmp/envs.yaml', 'w') as f:
              yaml.safe_dump({
                  'NODE_ENV': 'production',
                  'DATABASE_URL': os.environ['DATABASE_URL'],
              }, f)
          "
          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="$GCP_REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --memory=1Gi \
            --cpu=1 \
            --max-instances=3 \
            --env-vars-file=/tmp/envs.yaml \
            --quiet

      - name: Output service URL
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region="$GCP_REGION" \
            --format='value(status.url)')
          echo "🚀 Deployed: $URL"
          {
            echo "## 🚀 Deployment successful"
            echo ""
            echo "**URL:** $URL"
          } >> "$GITHUB_STEP_SUMMARY"
